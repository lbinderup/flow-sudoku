<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3efe7">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Flow Sudoku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3efe7;--panel:#fffdf8;--ink:#23222a;--muted:#7a7684;--line:#d6cfc2;--thick:#3a3842;
  --accent:#2a6f97;--accent-soft:#d7e9f3;--user:#2a6f97;--peer:#efe9de;--same:#f7dc9c;--sel:#bcdff1;
  --conf:#cf3b3b;--confbg:#f8d6d2;--note:#8c8796;--notehi:#a8650a;--btn:#e9e3d7;--btn-ink:#3a3842;
  --flash:#cfeec4;--blocked:#e6e0d4;--scan:rgba(58,56,66,.22);--scan-bg:rgba(58,56,66,.05);--shadow:0 10px 30px rgba(40,30,10,.12);
}
[data-theme=dark]{
  --bg:#121317;--panel:#1b1d23;--ink:#ebe8e1;--muted:#8f8c98;--line:#30333c;--thick:#7f7c89;
  --accent:#7cc4e4;--accent-soft:#1e3a4a;--user:#7cc4e4;--peer:#22252d;--same:#5b4a1c;--sel:#1f4b64;
  --conf:#ff7b72;--confbg:#4b2424;--note:#8f8c98;--notehi:#f2b84b;--btn:#252830;--btn-ink:#dcd9d2;
  --flash:#294a27;--blocked:#353844;--scan:rgba(235,232,225,.17);--scan-bg:rgba(235,232,225,.04);--shadow:0 10px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#app{--bs:min(calc(100vw - 20px),calc(100vh - 430px),560px);--bs:min(calc(100vw - 20px),calc(100dvh - 430px),560px);
  --cw:min(calc(100vw - 20px),560px);max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 12px)}
header{width:var(--cw);display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-weight:600;font-size:19px;white-space:nowrap;letter-spacing:.2px;display:flex;align-items:center;gap:7px}
.brand i{display:inline-block;width:18px;height:18px;border-radius:5px;background:conic-gradient(from 45deg,var(--accent),var(--notehi),var(--accent))}
.hdr-right{display:flex;align-items:center;gap:4px}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--btn-ink)}
.icon-btn:active{background:var(--btn)}
.icon-btn svg,.tool svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.timer{font-variant-numeric:tabular-nums;font-weight:500;font-size:16px;padding:7px 10px;border-radius:12px;display:flex;align-items:center;gap:6px;color:var(--btn-ink)}
.timer svg{width:14px;height:14px;fill:currentColor;stroke:none}
.timer.hide-time span{display:none}
.bar{width:var(--cw);display:flex;align-items:center;gap:8px}
.tiers{flex:1;display:flex;background:var(--btn);border-radius:13px;padding:3px;position:relative}
.tiers button{flex:1;padding:8px 0;border-radius:10px;font-weight:500;font-size:14.5px;color:var(--muted);position:relative;z-index:1;transition:color .2s}
.tiers button.on{color:var(--ink)}
.tiers .pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/4);border-radius:10px;background:var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.12);transition:transform .25s cubic-bezier(.3,.7,.3,1)}
.tiers button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--notehi);margin-left:5px;vertical-align:2px;opacity:0;transition:opacity .2s}
.tiers button.prog .dot{opacity:.9}
.new-btn{padding:10px 14px;border-radius:13px;background:var(--accent);color:var(--panel);font-weight:600;font-size:15px;white-space:nowrap}
[data-theme=dark] .new-btn{color:#0f1a20}
.meta{width:var(--cw);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;min-height:17px}
.board-wrap{position:relative;width:var(--bs);height:var(--bs);flex:none}
#board{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);width:100%;height:100%;
  border:2.5px solid var(--thick);border-radius:12px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow);transition:filter .25s}
.cell{position:relative;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--bs) / 14.5);font-weight:400;line-height:1;cursor:pointer;transition:background-color .12s}
.cell.c2,.cell.c5{border-right:2.5px solid var(--thick)}.cell.c8{border-right:0}
.cell.r2,.cell.r5{border-bottom:2.5px solid var(--thick)}.cell.r8{border-bottom:0}
.cell.given{font-weight:600}
.cell.user .v{color:var(--user);font-weight:500}
.cell.peer{background:var(--peer)}
[data-theme=dark] .cell.blocked .notes span.on{opacity:.55}
#scan{position:absolute;inset:2.5px;pointer-events:none;z-index:2}
#scan svg{display:block;width:100%;height:100%;animation:scanIn .18s ease-out}
@keyframes scanIn{from{opacity:0}to{opacity:1}}
.cell.same{background:var(--same)}
.cell.sel{background:var(--sel)}
.cell.conf{background:var(--confbg)}
.cell.conf .v{color:var(--conf)}
.cell.sel.conf{box-shadow:inset 0 0 0 2px var(--conf)}
.cell.flash{animation:flash .7s ease-out}
.cell.pop .v{animation:pop .22s ease-out}
@keyframes flash{0%{background:var(--flash)}100%{}}
@keyframes pop{0%{transform:scale(.6);opacity:.3}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.v{pointer-events:none}
.notes{position:absolute;inset:1px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);pointer-events:none}
.notes span{display:flex;align-items:center;justify-content:center;font-size:calc(var(--bs) / 34);color:var(--note);opacity:0;font-weight:500}
.notes span.on{opacity:1}
.notes span.hi{color:var(--panel);background:var(--notehi);border-radius:50%;width:84%;height:84%;margin:auto;font-weight:600}
[data-theme=dark] .notes span.hi{color:#1b1d23}
.cover{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;border-radius:12px;font-weight:500;color:var(--ink);text-align:center}
.cover.show{display:flex}
#pauseCover{background:color-mix(in srgb,var(--panel) 55%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:18px}
#pauseCover svg{width:54px;height:54px;fill:var(--accent)}
#genCover{background:color-mix(in srgb,var(--panel) 70%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-size:15px;color:var(--muted)}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tools{width:var(--cw);display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.tool{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;border-radius:12px;font-size:11px;white-space:nowrap;color:var(--btn-ink);position:relative}
.tool:active{background:var(--btn)}
.tool:disabled{opacity:.35}
.tool.on{background:var(--accent-soft);color:var(--accent)}
.tool .badge{position:absolute;top:3px;right:calc(50% - 22px);font-size:9px;font-weight:700;background:var(--muted);color:var(--panel);border-radius:6px;padding:1px 4px}
.tool.on .badge{background:var(--accent)}
.tool.dim{opacity:.4}
.pad .smart{gap:2px}
.pad .smart .sl{font-size:12px;font-weight:600;color:var(--btn-ink);letter-spacing:.2px}
.pad .smart.dim{opacity:.45}
.pad .smart.ready{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pad .smart.ready svg{stroke:var(--panel)}
.pad .smart.ready .sl{color:var(--panel)}
[data-theme=dark] .pad .smart.ready svg{stroke:#0f1a20}
[data-theme=dark] .pad .smart.ready .sl{color:#0f1a20}
.pad .smart.err .sl{color:var(--conf)}
.cell.warn{animation:warn .55s ease-out 2}
@keyframes warn{0%{background:var(--conf);color:var(--panel)}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}100%{transform:none}}
.pad{width:var(--cw);display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.pad button{background:var(--btn);border-radius:16px;padding:6px 0 5px;justify-content:center;display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .08s,background .15s,opacity .2s}
.pad button:active{transform:scale(.93)}
.pad .d{font-size:clamp(40px,calc(var(--cw) / 7.5),64px);font-weight:500;line-height:1.05;color:var(--accent)}
.pad .erase svg{width:clamp(30px,calc(var(--cw) / 11),44px);height:clamp(30px,calc(var(--cw) / 11),44px);fill:none;stroke:var(--btn-ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pad .n{font-size:13px;color:var(--muted);height:15px}
.pad.nocount .n{visibility:hidden}
.pad button.done{opacity:.28}
.pad button.lock{background:var(--accent);}
.pad button.lock .d,.pad button.lock .n{color:var(--panel)}
[data-theme=dark] .pad button.lock .d,[data-theme=dark] .pad button.lock .n{color:#0f1a20}
.pad.notes-mode .d{font-size:clamp(32px,calc(var(--cw) / 11),44px);font-weight:600;color:var(--notehi);line-height:1.43}
.hint-line{font-size:12px;color:var(--muted);min-height:15px;text-align:center}
/* modal */
.modal{position:fixed;inset:0;background:rgba(10,10,14,.42);display:flex;align-items:flex-end;justify-content:center;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.show{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:18px 20px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(30px);transition:transform .25s cubic-bezier(.3,.7,.3,1)}
.modal.show .sheet{transform:none}
@media (min-width:640px){.modal{align-items:center}.sheet{border-radius:22px}}
.sheet h2{margin:2px 0 14px;font-size:21px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.sheet h3{margin:18px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .lbl{font-size:15px}.row .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.switch{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch.on{background:var(--accent)}.switch.on::after{transform:translateX(18px)}
.seg{display:flex;background:var(--btn);border-radius:10px;padding:2px}
.seg button{padding:6px 11px;border-radius:8px;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--btn);font-weight:600;font-size:16px;margin-top:10px;text-align:center}
.btn.primary{background:var(--accent);color:var(--panel)}
[data-theme=dark] .btn.primary{color:#0f1a20}
.btn.danger{color:var(--conf)}
.x{width:34px;height:34px;border-radius:50%;background:var(--btn);display:grid;place-items:center;font-size:18px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat-card{background:var(--bg);border-radius:14px;padding:12px 10px}
.stat-card .t{font-weight:600;font-size:14px;margin-bottom:8px}
.stat-card .k{font-size:11.5px;color:var(--muted)}
.stat-card .val{font-size:19px;font-weight:500;font-variant-numeric:tabular-nums;margin-bottom:7px}
.win-hero{text-align:center;padding:6px 0 4px}
.win-hero .big{font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.win-hero .sub{color:var(--muted);font-size:14px}
.badge-pb{display:inline-block;background:var(--notehi);color:var(--panel);font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px;margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0 2px}
.chip{font-size:12.5px;padding:5px 10px;border-radius:20px;background:var(--btn);color:var(--btn-ink)}
.help p{font-size:14.5px;line-height:1.5;margin:6px 0;color:var(--ink)}
.help b{font-weight:600}
/* training */
#techChips{width:var(--cw);display:none;gap:6px;overflow-x:auto;scrollbar-width:none;padding:1px 0;-webkit-overflow-scrolling:touch}
#techChips::-webkit-scrollbar{display:none}
body.train #techChips{display:flex}
body.train .meta{display:none}
body.train #timerBtn{visibility:hidden}
.tchip{flex:none;padding:6px 12px;border-radius:16px;background:var(--btn);font-size:13.5px;color:var(--btn-ink);white-space:nowrap}
.tchip.on{background:var(--accent);color:var(--panel)}
[data-theme=dark] .tchip.on{color:#0f1a20}
.tools.train{display:none;grid-template-columns:repeat(4,1fr)}
body.hunt .tools.main{display:none}
body.hunt .tools.train{display:grid}
.tool.ready{background:var(--accent);color:var(--panel)}
[data-theme=dark] .tool.ready{color:#0f1a20}
body.hunt #app{--bs:min(calc(100vw - 40px),calc(100vh - 420px),520px);--bs:min(calc(100vw - 40px),calc(100dvh - 420px),520px)}
body.hunt .board-wrap{margin:14px 0 0 18px}
body.hunt .pad{grid-template-columns:repeat(9,1fr);gap:4px}
body.hunt .pad .smart{display:none}
body.hunt .pad button{padding:8px 0;border-radius:11px}
body.hunt .pad .d{font-size:clamp(20px,calc(var(--cw) / 15),28px)}
body.hunt .pad .n{display:none}
body.hunt .pad button.focus{background:var(--notehi)}
body.hunt .pad button.focus .d{color:var(--panel)}
.coach{width:var(--cw);display:none;background:var(--panel);border-radius:14px;padding:9px 13px 10px;box-shadow:0 2px 10px rgba(0,0,0,.07);min-height:66px}
body.hunt .coach{display:block}
.coach .ct{font-size:11.5px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.7px;display:flex;justify-content:space-between;gap:8px}
.coach .ct .cs{color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.coach .cm{font-size:14.5px;line-height:1.42;margin-top:3px}
.coach.ok .ct span:first-child{color:#3c9a5f}
.coach.ok{box-shadow:0 0 0 2px #3c9a5f55}
#huntOv{position:absolute;inset:2.5px;pointer-events:none;z-index:3}
#huntOv svg{display:block;width:100%;height:100%}
#huntOv .rg{fill:var(--accent);fill-opacity:.11;stroke:var(--accent);stroke-opacity:.6;stroke-width:.4}
#huntOv .pc{fill:var(--accent);fill-opacity:.22;stroke:var(--accent);stroke-width:.5}
#huntOv .pcell{fill:none;stroke:var(--accent);stroke-width:.7}
#huntOv .pcell.piv{stroke-width:1.2}
#huntOv .pcell.nofx{stroke:var(--muted);stroke-dasharray:1.4 1}
#huntOv .ln{stroke:var(--accent);stroke-width:.55;stroke-opacity:.85;stroke-dasharray:1.3 .9;fill:none}
#huntOv .ex{stroke:var(--conf);stroke-width:.6;stroke-linecap:round;fill:none}
.counts{position:absolute;display:none;font-size:11px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.counts.show{display:grid}
.counts span{display:flex;align-items:center;justify-content:center}
.counts span.k2{color:var(--panel);background:var(--notehi);border-radius:5px;margin:1px}
.counts span.k3{color:var(--notehi)}
.counts span.kp{opacity:.45;font-size:10px}
#colCounts{top:-16px;left:2.5px;right:2.5px;height:14px;grid-template-columns:repeat(9,1fr)}
#rowCounts{left:-17px;top:2.5px;bottom:2.5px;width:15px;grid-template-rows:repeat(9,1fr)}
.coach-cta{font:inherit;font-size:13px;font-weight:600;color:var(--panel);background:var(--notehi);padding:7px 13px;border-radius:12px;animation:ctaIn .3s ease-out}
[data-theme=dark] .coach-cta{color:#1b1d23}
@keyframes ctaIn{from{transform:translateY(6px);opacity:0}}
.tstats{width:100%;border-collapse:collapse;font-size:13.5px}
.tstats td{padding:6px 2px;border-bottom:1px solid var(--line)}
.tstats td+td{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.hap{position:absolute;inset:0;z-index:4;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hap input{position:absolute;left:0;top:0;width:1px;height:1px;margin:0;opacity:0;visibility:hidden;pointer-events:none}
body.nohap .hap{display:none}
.pad button{position:relative}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 26px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:30;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.board-wrap.won #board .cell{animation:wave .6s ease-out both}
@keyframes wave{0%{background:var(--flash)}100%{}}
/* juice: feel only, no behaviour */
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cell.tick{animation:tick .55s ease-out}
@keyframes tick{0%{background:var(--accent-soft)}100%{}}
.coach{transition:box-shadow .3s}
.pad button.gotit{opacity:1}
@media (prefers-reduced-motion:no-preference){
  .pad button{transition:transform .3s cubic-bezier(.3,1.6,.5,1),background-color .15s,opacity .35s}
  .pad button:active{transform:scale(.92);transition-duration:.06s,.15s,.35s}
  .tool,.icon-btn,.new-btn{transition:transform .3s cubic-bezier(.3,1.6,.5,1),background-color .15s,color .15s,opacity .2s}
  .tool:not(:disabled):active,.icon-btn:active,.new-btn:active{transform:scale(.92);transition-duration:.06s,.15s,.15s,.2s}
  .pad button.gotit{animation:gotit .5s ease-out}
  @keyframes gotit{40%{transform:scale(1.1);background:var(--accent-soft)}}
  .pad .smart.glow{animation:glow .5s ease-out}
  @keyframes glow{0%{box-shadow:0 0 0 0 var(--accent)}60%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 3px var(--accent-soft)}}
  .notes span{transform:scale(.45);transition:opacity .14s ease-out,transform .2s cubic-bezier(.3,1.5,.5,1)}
  .notes span.on{transform:none}
  .cell.gone::after{content:attr(data-g);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--user);font-weight:500;pointer-events:none;animation:gone .2s ease-in forwards}
  @keyframes gone{to{opacity:0;transform:scale(.55)}}
  .board-wrap.deal .cell:not(.pop) .v,.board-wrap.deal .notes{animation:deal .34s cubic-bezier(.2,.8,.3,1) both;animation-delay:var(--dl)}
  @keyframes deal{from{opacity:0;transform:scale(.75)}}
  #pauseCover.show{animation:coverIn .2s ease-out}
  @keyframes coverIn{from{opacity:0}}
  #toast{transition:opacity .2s,transform .32s cubic-bezier(.3,1.5,.5,1)}
  .badge-pb{animation:pbIn .4s .55s cubic-bezier(.3,1.6,.5,1) both}
  @keyframes pbIn{from{opacity:0;transform:scale(.6)}}
  .coach .cm.fresh{animation:fresh .24s ease-out}
  @keyframes fresh{from{opacity:.2;transform:translateY(3px)}}
  #huntOv .nw{animation:ovFade .25s ease-out both}
  #huntOv .pcell.nw,#huntOv .pc.nw,#huntOv .ex.nw{transform-box:fill-box;transform-origin:center;animation-name:ovPop;animation-duration:.3s;animation-timing-function:cubic-bezier(.3,1.5,.5,1)}
  @keyframes ovFade{from{opacity:0}}
  @keyframes ovPop{from{opacity:0;transform:scale(1.6)}}
}
</style>
</head>
<body>
<div id="app">
  <header>

      for (let a = 0; a < cs.length; a++) for (let b = a + 1; b < cs.length; b++) {
        const A = cs[a], B = cs[b];
        if (ROW[A] === ROW[B] || COL[A] === COL[B]) { const [x1, y1] = notePos(A, inst.digit), [x2, y2] = notePos(B, inst.digit); s += `<line class="ln" x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}"/>`; }
      }
    } else if (inst.tech === 'XY-Wing' || inst.tech === 'XYZ-Wing') {
      const [p, ...ws] = inst.cells;
      for (const w of ws) s += `<line class="ln" x1="${COL[p] * 10 + 5}" y1="${ROW[p] * 10 + 5}" x2="${COL[w] * 10 + 5}" y2="${ROW[w] * 10 + 5}"/>`;
    }
  }
  for (const c of shown) {
    const t = inst ? inst.tech : '';
    if (inst && inst.digit && DIGIT_TECH[t]) { const [x, y] = notePos(c, inst.digit); s += `<circle class="pc" cx="${f(x)}" cy="${f(y)}" r="1.55"/>`; }
    else if (inst && (t === 'Hidden pair' || t === 'Hidden triple')) {
      s += `<rect class="pcell" x="${COL[c] * 10 + .7}" y="${ROW[c] * 10 + .7}" width="8.6" height="8.6" rx="1.6"/>`;
      if (h.done) for (const d of digitsOf(inst.digits & cands[c])) { const [x, y] = notePos(c, d); s += `<circle class="pc" cx="${f(x)}" cy="${f(y)}" r="1.55"/>`; }
    } else {
      const piv = inst && (t === 'XY-Wing' || t === 'XYZ-Wing') && c === inst.cells[0];
      s += `<rect class="pcell${piv ? ' piv' : ''}" x="${COL[c] * 10 + .7}" y="${ROW[c] * 10 + .7}" width="8.6" height="8.6" rx="1.6"/>`;
    }
  }
  if (h.nofx) for (const c of h.nofx.cells) s += `<rect class="pcell nofx" x="${COL[c] * 10 + .7}" y="${ROW[c] * 10 + .7}" width="8.6" height="8.6" rx="1.6"/>`;
  if (inst && h.done && !h.applied) for (const [c, m] of inst.elims) for (const d of digitsOf(m)) {
    const [x, y] = notePos(c, d), r = 1.25;
    s += `<path class="ex" d="M${f(x - r)} ${f(y - r)}L${f(x + r)} ${f(y + r)}M${f(x + r)} ${f(y - r)}L${f(x - r)} ${f(y + r)}"/>`;
  }
  const parts = s.split(/(?=<)/).filter(Boolean);
  let k = 0;
  s = parts.map(p => huntPrev.has(p) ? p : p.replace('class="', p.includes('class="ex"') ? `style="animation-delay:${Math.min(k++, 12) * 30}ms" class="nw ` : 'class="nw ')).join('');
  huntPrev = new Set(parts);
  huntEl.innerHTML = `<svg viewBox="0 0 90 90" preserveAspectRatio="none" aria-hidden="true">${s}</svg>`;
}
const colCounts = document.getElementById('colCounts'), rowCounts = document.getElementById('rowCounts');
for (let k = 0; k < 9; k++) { colCounts.appendChild(document.createElement('span')); rowCounts.appendChild(document.createElement('span')); }
function drawCounts(g) {
  const on = !!(hunt && g && focusD && settings.tcounts);
  colCounts.classList.toggle('show', on); rowCounts.classList.toggle('show', on);
  if (!on) return;
  const bit = 1 << (focusD - 1);
  for (let k = 0; k < 9; k++) {
    let rc = 0, cc = 0, rp = false, cp = false;
    for (let j = 0; j < 9; j++) {
      const a = k * 9 + j, b = j * 9 + k;
      if (g.vals[a] === focusD) rp = true; else if (!g.vals[a] && (g.notes[a] & bit)) rc++;
      if (g.vals[b] === focusD) cp = true; else if (!g.vals[b] && (g.notes[b] & bit)) cc++;
    }
    const set = (el, n, placed) => { el.textContent = placed ? '✓' : n || ''; el.className = placed ? 'kp' : n === 2 ? 'k2' : n === 3 ? 'k3' : ''; };
    set(rowCounts.children[k], rc, rp); set(colCounts.children[k], cc, cp);
  }
}
function setCoachMsg(t) { // new guidance text eases in so the change registers
  const m = $('#coachMsg'); if (m.textContent === t) return;
  m.textContent = t; if (t && motionOK()) replay(m, 'fresh');
}
function renderTrainUI(g) {
  document.body.classList.toggle('hunt', !!hunt || tier === 4);
  document.body.classList.toggle('train', tier === 4);
  const card = $('#coachCard');
  if (hunt) {
    const h = hunt;
    const title = h.src === 'coach' ? 'Coach' : (h.techKnown ? (h.done ? h.solvedInst.tech : h.tech) : 'Mystery pattern');
    const st = h.techKnown && tstats[h.done ? h.solvedInst.tech : h.tech];
    $('#coachTitle').innerHTML = `<span>${title}${h.done ? (h.revealed ? ' · revealed' : ' · found!') : ''}</span><span class="cs">${st ? `${st.clean} found · ${st.hinted} hinted · ${st.revealed} shown` : ''}</span>`;
    setCoachMsg(h.msg);
    card.classList.toggle('ok', h.done && !h.revealed);
  } else if (tier === 4) {
    $('#coachTitle').innerHTML = '<span>Training</span>';
    setCoachMsg(waitDrill ? `Searching generated puzzles for ${trainTech === 'Mix' ? 'drills' : article(trainTech) + ' ' + trainTech}. Rare ones like Swordfish can take a few seconds.` : '');
  }
  $('#hintBtn').disabled = !hunt || hunt.done;
  $('#hintLbl').textContent = !hunt || hunt.done ? 'Show me' : hunt.stage === 0 ? 'Show me' : hunt.stage === 1 ? 'Show more' : 'Reveal';
  $('#applyBtn').disabled = !hunt || !hunt.done || hunt.applied;
  $('#applyBtn').classList.toggle('ready', !!(hunt && hunt.done && !hunt.applied));
  $('#countsBtn').classList.toggle('on', !!settings.tcounts);
  $('#exitLbl').textContent = tier === 4 ? 'Next' : 'Exit';
  $('#newBtn').textContent = tier === 4 ? 'Next' : 'New';
  document.querySelectorAll('#techChips button').forEach(b => b.classList.toggle('on', b.dataset.t === trainTech));
  $('#trainerBtn').disabled = !coachReady;
  drawHunt(g); drawCounts(g);
}
{ const chips = $('#techChips');
  chips.innerHTML = ['Mix', ...TECHS].map(t => `<button class="tchip" data-t="${t}">${t}</button>`).join('');
  chips.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; trainTech = b.dataset.t; LS.set('fs.trainTech', trainTech); b.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' }); startDrill(); });
}
$('#hintBtn').onclick = huntHint;
$('#applyBtn').onclick = huntApply;
$('#countsBtn').onclick = () => { settings.tcounts = !settings.tcounts; saveSettings(); if (!focusD) toast('Tap a number below to see its line counts'); render(); };
$('#exitBtn').onclick = exitHunt;
$('#trainerBtn').onclick = startCoach;

// ---------- boot ----------
if (IS_IOS) {
  cells.forEach(c => addHaptic(c.el));
  document.querySelectorAll('#pad button, .tool, #tiers button, #newBtn').forEach(addHaptic);
}
const syncHaptics = () => document.body.classList.toggle('nohap', !settings.haptics);
syncHaptics();
if (games[tier]) deal();
ensureGame(tier);
syncHunt();
pump();
render();
})();
</script>
